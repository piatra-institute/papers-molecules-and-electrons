- id: trap-price-abstract
  kind: computation
  evidence:
    file: simulation/output/results.json
    run_id: model
    conditions: default calibration of Section 3; deterministic RK4 integration, step 0.02 years
    pointer: /price_lever/p_trap
    reported: '7.88'
    decimals: 2
    units: dollars per thousand cubic feet
  passage: Holding the price below a trap price of 7.88 dollars per thousand cubic feet keeps the importer
    below threshold.
- id: extend-harvest-ratio-abstract
  kind: computation
  evidence:
    file: simulation/output/results.json
    run_id: model
    conditions: discount rate 0.03, substitution speed 0.6, extend price 5.5, harvest price 9.5
    pointer: /harvest_vs_extend/extend_over_harvest_ratio
    reported: '1.9'
    decimals: 1
    units: ratio of present values
  passage: For a patient exporter facing fast substitution, extending the fossil age by limit pricing
    yields 1.9 times the present value of harvesting it at a high price, and the rent-maximizing price
    stays below the trap price only for discount rates below 0.171 and substitution speeds above 0.188.
