- id: tooze-definitions
  kind: source
  evidence:
    citation_id: tooze2026
    locator: Chartbook 439, opening section
    verified: true
    verification_note: 'Post retrieved from adamtooze.substack.com (dated 2 April 2026): it calls a country
      an electrostate if it draws a large and increasing share of total final energy consumption as electricity,
      and reserves petrostate for economies dependent on oil and gas for rents, value added, export earnings
      or government revenue.'
  passage: The contrast between petrostates and electrostates has been examined most carefully by Adam
    Tooze, who defines an electrostate by the large and increasing share of its final energy it draws
    as electricity and a petrostate by its dependence on oil and gas for rents, export earnings or government
    revenue [@tooze2026].
- id: tooze-us-both
  kind: source
  evidence:
    citation_id: tooze2026
    locator: Chartbook 439, sections on the United States
    verified: true
    verification_note: 'Same post: the US "is an electrostate, just one that is slouching", while oil
      and gas are not large enough to make even Texas a petrostate in the strong sense; this supports
      the dual characterization. The fossil-export focus is the paper''s own scoping.'
  passage: The United States is not a petrostate in the fiscal sense; it holds molecule power and electron
    power at once, and the object of analysis is its fossil-export strategy [@tooze2026].
- id: acemoglu-directed
  kind: source
  evidence:
    citation_id: acemoglu2012
    locator: Abstract
    verified: true
    verification_note: DOI 10.1257/aer.102.1.131; abstract (OpenAlex) describes directed technical change
      between clean and dirty sectors, with temporary taxation and research subsidies sufficing to redirect
      innovation when inputs are substitutable.
  passage: The directed-technical-change feedback that creates the threshold also makes it persistent,
    since policy that redirects innovation toward the clean sector changes relative costs endogenously
    [@acemoglu2012].
- id: molecule-power-def
  kind: definition
  rationale: 'Introduces the paper''s first term: leverage from a recurring, metered flow interruptible
    at chokepoints, following Hirschman''s account of trade dependence.'
  passage: Oil and gas are flows metered at wells, straits, pipelines and regasification terminals, and
    the exporter's leverage is the standing option to slow or stop the flow at a chokepoint the importer
    cannot quickly bypass.
- id: electron-power-def
  kind: definition
  rationale: Defines electron power by the traded capital stock and standards, not a flow; the contrast
    with molecule power drives the model.
  passage: An electrostate's leverage is a platform on which others build, and its rent is the margin
    on installed equipment and control of the next generation of standards.
- id: structural-delay
  kind: interpretation
  rationale: 'Follows from the definitions: molecule revenue requires an unelectrified customer. It is
    an incentive claim, not a claim about any actor''s intentions.'
  passage: The fossil exporter therefore has a structural interest in delay that an electron exporter
    lacks.
- id: replicator-assumption
  kind: assumption
  rationale: Linear advantage function in the electric share; bistability and the trap price depend on
    this local form, which the Limitations section flags.
  passage: A local linearization of both gives $\Delta(x) = A + (\ell - \kappa) x$, with learning slope
    $\ell$ and integration slope $\kappa$, so that
- id: price-in-advantage
  kind: assumption
  rationale: The fossil price shifts the electric advantage linearly; this is the channel through which
    limit pricing acts.
  passage: 'The exporter''s price enters $A$: a higher fossil price raises the advantage of electrifying,
    $A(p_P) = A_{\text{base}} + \alpha (p_P - p_{\text{ref}})$.'
- id: calibration-illustrative
  kind: assumption
  rationale: All modelled numbers are conditional on the stated calibration; crossovers and capitalized
    stake move with it.
  passage: The magnitudes are illustrative and anchored to public 2025 figures.
- id: limit-pricing-reveals
  kind: interpretation
  rationale: 'Inference from the harvest/extend comparison: limit pricing pays only when unobstructed
    substitution is fast, so observing it signals that expectation within the model.'
  passage: An exporter that holds its price down and forgoes current rents reveals an expectation that
    the unobstructed transition would be fast, because only that expectation makes the sacrifice pay.
- id: stake-mispriced
  kind: interpretation
  rationale: Compares the capitalized rent with one year of displaced sales; holds for any defensible
    margin, discount rate and horizon, as stated in the preceding sentence.
  passage: 'The original argument therefore understated the stake: it priced a perpetuity as a single
    year''s payment and recorded that payment in the trade balance.'
- id: no-coordination
  kind: interpretation
  rationale: Parsimony argument about the Romanian case; the model shows the outcome is produced without
    coordination, it does not show that coordination is absent.
  passage: When four independent mechanisms produce an outcome, a fifth mechanism, a coordinating instruction
    from Washington, is not required to explain it.
- id: evidence-limit
  kind: interpretation
  rationale: States the evidential limit of the public record on the Romanian case.
  passage: It does not establish a temporal sequence in which one preceded and produced the other, nor
    does it document an instruction.
