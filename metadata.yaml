abstract: A hypothesis circulating in Bucharest holds that Romania's turn toward gas serves a United States
  strategy of keeping Europe on fossil fuels, and it prices the stake as a 1.7 to 3.6 percent deterioration
  of the US current-account deficit. The interest is real and the arithmetic wrong. We distinguish molecule
  power, control over a recurring fuel flow metered at chokepoints, from electron power, control over
  a capital stock and its standards. Because molecule revenue requires the customer to remain unelectrified,
  a fossil exporter has a structural interest in delay. We model an importing region's electric share
  with a replicator equation including technological learning; the system is bistable, and the exporter's
  price moves the takeoff threshold. Holding the price below a trap price of 7.88 dollars per thousand
  cubic feet keeps the importer below threshold. For a patient exporter facing fast substitution, extending
  the fossil age by limit pricing yields 1.9 times the present value of harvesting it at a high price,
  and the rent-maximizing price stays below the trap price only for discount rates below 0.171 and substitution
  speeds above 0.188. The displacement the hypothesis priced amounts to 0.13 to 0.23 percent of the deficit,
  an order of magnitude less than claimed, whereas the capitalized European rent that a takeoff would
  terminate is about 289 billion dollars, 113 times the annual figure. Because learning is global, a rival's
  continued deployment erodes any suppression, so limit pricing buys a finite delay. The Romanian outcome
  follows from each actor's independent optimum without coordination; pricing the incentive does not establish
  an instruction.
web_blurb: A fossil exporter earns rent only while its customer stays unelectrified. In a bistable transition
  model, a patient exporter gains by holding its price below the importer's takeoff threshold, but global
  learning bounds the delay it can buy.
