abstract: |-
  A hypothesis circulating in Bucharest holds that Romania's turn toward gas serves an American strategy to keep Europe on fossil fuels and out of an electrified, autonomous future, and it prices the stake as a 1.7 to 3.6 percent hit to the United States current-account deficit. The intuition is right and the arithmetic is wrong, and fixing the arithmetic requires distinguishing two forms of energy power that the word energy fuses. Molecule power is power over a flow metered at a chokepoint: the customer must keep buying, the rent recurs, the leverage is a tap. Electron power is power over a stock and a standard: the customer buys the capital once, the fuel is then free, and the residual dependence is on equipment, software, and standards rather than on a daily delivery. The asymmetry that organizes everything is that molecule revenue requires the customer to stay un-electrified, so a fossil exporter has a structural interest in delay. This paper builds the smallest dynamical model that makes the interest legible: an importing region's electric share follows a replicator equation with technological learning, which is bistable, with an interior takeoff threshold the exporter's price can move. Solved on that model, three results follow. First, the exporter faces a dilemma between harvesting the fossil age at a high price, which accelerates the importer past the threshold and ends the rent, and extending it by limit-pricing, which keeps the importer trapped; extending beats harvesting by a present-value factor near 1.9 only when the exporter is patient and substitution would otherwise be fast, so a state that suppresses its own price reveals it believes takeoff is near. Second, the original current-account arithmetic is an order of magnitude too large and in the wrong ledger: the displacement is about 0.13 to 0.23 percent of the deficit, while the stake the exporter actually defends is the capitalized European rent a takeoff terminates, near 289 billion dollars, roughly 113 times the annual trade-flow figure. Third, the delay is bounded: because the learning curve is global, an exporter that suppresses one region's deployment still faces a threshold dragged down by whatever rival keeps deploying, so limit-pricing buys a finite delay of years, not a reprieve. The Romanian outcome the hypothesis fears is generated by each actor's independent optimum without any coordination, which makes the conspiracy reading not merely unproven but unnecessary, and the paper is precise that pricing the incentive is not establishing the instruction. Ships a runnable simulation whose output carries every modelled number.
